[project]
name = "dapm"
version = "0.1.0"
description = "Day-ahead electricity price forecasting with an MLOps loop: tracking, registry, drift, retraining"
requires-python = ">=3.14"
dependencies = [
    "mlflow>=3.15,<4",
    "scikit-learn>=1.9,<2",
    "pyarrow>=25,<26",
    "entsoe-py>=0.8",
    "pandas>=2.3.3,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = ["error"]

