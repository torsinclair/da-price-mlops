[project]
name = "dapm"
version = "0.1.0"
description = "Day-ahead electricity price forecasting with an MLOps loop: tracking, registry, drift, retraining"
requires-python = ">=3.14"
dependencies = [
    "mlflow>=3.15,<4",
    "scikit-learn>=1.9,<2",
    "pyarrow>=25,<26",
    "entsoe-py>=0.8",
    "pandas>=2.3.3,<3",
    "python-dotenv>=1,<2",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # pandas 2.3.x internally hits a NumPy 2.5 timedelta deprecation via
    # pd.Timedelta(...). Not fixable in our code; pandas 3 resolves it but
    # is blocked by mlflow's pandas<3 cap. Revisit when mlflow lifts the cap.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # mlflow.pyfunc import warns about mlflow's own agent type hints
    # ("... is inferred as AnyType ..."), with ANSI codes prefixing the
    # message (hence the leading .*). Cosmetic, third-party. Revisit on
    # mlflow upgrades.
    "ignore:.*is inferred as AnyType:UserWarning",
    # mlflow's file utils still use codecs.open(), which Python 3.14
    # deprecates. Stdlib-origin warning, not fixable here. Revisit on
    # mlflow upgrades.
    "ignore:codecs.open:DeprecationWarning",
    # SQLAlchemy 2.1 deprecates the noload loader strategy, which mlflow's
    # SQL tracking store still uses. Third-party, not fixable here. Revisit
    # on mlflow upgrades.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
